-size="14" font-weight="bold" lengthAdjust="spacing" textLength="155" x="21" y="374.125">BorderColor DarkBlue</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="5" x="5" y="391.7344">}</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="0" x="9" y="409.3438"/><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="162" x="5" y="426.9531">actor Cliente as cliente</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="0" x="9" y="444.5625"/><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="404" x="5" y="462.1719">object ":HistorialPedidosClienteController" as controller {</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="95" x="9" y="479.7813">Syntax Error?</text><!--MD5=[0c1484aa858932a07176a36522274fb3]
@startuml CU23_Historial_Pedidos_Cliente

' Configuración para diagrama horizontal
left to right direction
skinparam backgroundColor #FEFEFE
skinparam actorStyle awesome

' Estilos
skinparam class {
    BackgroundColor LightYellow
    BorderColor Black
    ArrowColor Black
}

skinparam note {
    BackgroundColor LightBlue
    BorderColor DarkBlue
}

' ============================================
' ACTORES
' ============================================
actor Cliente as cliente

' ============================================
' CONTROLADORES Y CLASES
' ============================================
object ":HistorialPedidosClienteController" as controller {
    +index()
    +show()
    +reordenar()
    +storeReorden()
    +estadisticas()
    +exportar()
    +buscar()
}

object ":Pedido" as pedido {
    id
    cliente_id
    tipo
    estado
    total
}

object ":PedidoItem" as pedidoItem {
    id
    pedido_id
    producto_id
    cantidad
    precio_unitario
}

object ":Producto" as producto {
    id
    nombre
    precio
    activo
}

object ":InventarioProducto" as inventario {
    id
    producto_id
    stock_actual
}

object ":User" as user {
    id
    name
    email
}

object ":BitacoraController" as bitacora {
    +registrar()
}

object ":DB" as database {
    +transaction()
    +table()
}

' ============================================
' COMUNICACIONES CON NUMERACIÓN
' ============================================

' Flujo 1: Consultar Historial
cliente -> controller : 1: GET /cliente/historial
controller -> user : 2: Auth::id()
controller -> pedido : 3: where(cliente_id)
pedido -> database : 4: consultar BD
database - -> pedido : 5: registros
pedido - -> controller : 6: Collection<Pedido>
controller -> controller : 7: calcularEstadisticas()
controller -> bitacora : 8: registrar()
controller - -> cliente : 9: vista historial

' Flujo 2: Ver Detalle
cliente -> controller : 10: GET /cliente/historial/{id}
controller -> pedido : 11: findOrFail(id)
pedido -> database : 12: consultar con relaciones
database - -> pedido : 13: pedido completo
controller -> pedido : 14: verificar cliente_id
controller -> pedido : 15: getPromocionesAplicadas()
controller -> bitacora : 16: registrar()
controller - -> cliente : 17: vista detalle

' Flujo 3: Reordenar Pedido
cliente -> controller : 18: GET /historial/{id}/reordenar
controller -> pedido : 19: findOrFail(id)
controller -> producto : 20: verificar disponibilidad
producto -> inventario : 21: stock_actual
inventario - -> producto : 22: stock disponible
producto - -> controller : 23: productos disponibles
controller - -> cliente : 24: formulario reorden

cliente -> controller : 25: POST /historial/{id}/reordenar
controller -> database : 26: beginTransaction()
controller -> pedido : 27: create(nuevo pedido)
controller -> pedidoItem : 28: create(items)
controller -> inventario : 29: decrementarStock()
controller -> bitacora : 30: registrar()
controller -> database : 31: commit()
controller - -> cliente : 32: redirect con éxito

' Flujo 4: Ver Estadísticas
cliente -> controller : 33: GET /historial/estadisticas
controller -> pedido : 34: where(cliente_id)
controller -> database : 35: consultas agregadas
database - -> controller : 36: estadísticas
controller -> pedidoItem : 37: productos más pedidos
pedidoItem -> database : 38: GROUP BY producto
database - -> pedidoItem : 39: top productos
pedidoItem - -> controller : 40: resultados
controller -> bitacora : 41: registrar()
controller - -> cliente : 42: dashboard estadísticas

' Flujo 5: Exportar Historial
cliente -> controller : 43: GET /historial/exportar
controller -> pedido : 44: where(cliente_id)
pedido -> database : 45: consultar período
database - -> pedido : 46: registros
controller -> bitacora : 47: registrar()
controller - -> cliente : 48: archivo descarga

note right of controller
  **Métodos principales:**
  - index(): Lista historial
  - show(): Detalle pedido
  - reordenar(): Formulario
  - storeReorden(): Crear pedido
  - estadisticas(): Métricas
  - exportar(): PDF/Excel
  - buscar(): Búsqueda
end note

note bottom of pedido
  **Relaciones:**
  - belongsTo(User)
  - hasMany(PedidoItem)
  - hasMany(CobroCaja)
  - hasOne(Feedback)
end note

note bottom of inventario
  **Métodos:**
  - incrementarStock()
  - decrementarStock()
  - requiereAlerta()
end note

@enduml

